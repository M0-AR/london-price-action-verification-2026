services:
  research:
    build: .
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    command: python3 experiments/run_all.py

  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    command: bash -c "pip install jupyter >/dev/null 2>&1; jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"
    profiles: ["tools"]
